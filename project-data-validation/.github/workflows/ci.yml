
name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Run lint
        run: poetry run ruff check .

      - name: Run tests with coverage
        run: poetry run pytest --cov=data_quality --cov-report=term-missing
