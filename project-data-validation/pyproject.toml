[tool.poetry]
name = "project-data-validation"
version = "0.1.0"
description = ""
authors = ["bljain <nitinbljain@gmail.com>"]
readme = "README.md"
packages = [
    {include="data_quality", from="src"}
]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^3.0.6"
pytest = "^9.1.1"
ruff = "^0.17.1"
black = "^26.10.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.17.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
